version: '3.8'

services:
  miniature-office:
    build: .
    container_name: miniature-office
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=${FLASK_ENV:-development}
      - FLASK_DEBUG=0
      - SECRET_KEY=${SECRET_KEY}
      - HOST=0.0.0.0
      - PORT=5000
      - WORKERS=4
      - LOG_LEVEL=INFO
      - MO_WORKSPACE=/app/user_workspace
      - MO_DATA_DIR=/app/data
    volumes:
      - ./logs:/var/log/miniature-office
      - ./user_workspace:/app/user_workspace
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/ide/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - minioffice-network

networks:
  minioffice-network:
    driver: bridge
